<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cereza 3D Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a drafting sheet. Title block across the top, the pannable plan on the left,
   the schedule of numbers on the right; below 980px the schedule drops under the plan. */
:root{
  --sheet:#DCDCD2; --paper:#F4F3EC; --sky:#E8E7DE; --ink:#1B2A33; --soft:#6E7A80; --rule:#A9ACA1;
  --creek:#0E7C86; --mark:#8C3A2E; --ok:#2F6B4F; --setback:#BFC2B8; --exist:#9AA6AA;
  --new:#33454F; --newink:#F4F3EC; --fadu:#B4762F; --fgar:#7C6A52; --fstu:#4E6B72;
  --tree:#6E8360; --treeink:#3F5238;
  --m-l1:#8D979C; --m-l2:#44535B; --m-grass:#C3C9B4; --m-nb:#D9DBCD;
  --m-glass:#5F727A; --m-door:#5E4A3A; --m-gdoor:#DAD7CB; --floor:#FBF9F1; --gfloor:#E8E3D6; --glass:#BCD7E0; --m-wood:#76604E; --m-pave:#D6D0C0; --m-steel:#222527;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --cond:"IBM Plex Sans Condensed","Helvetica Neue",Arial Narrow,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sheet:#12171A; --paper:#1C2327; --sky:#171D21; --ink:#E4E7E2; --soft:#8E9BA0; --rule:#39444A;
    --creek:#31A9B0; --mark:#D8785F; --ok:#86BE9C; --setback:#2A3237; --exist:#59676E;
    --new:#CBD3C9; --newink:#12171A; --fadu:#C08A5E; --fgar:#9A876C; --fstu:#6E9199;
    --tree:#4B6350; --treeink:#8FA98A; --m-l1:#9AA6AB; --m-l2:#C6CEC6; --m-grass:#27332D; --m-nb:#36413B; --m-glass:#5F727A; --m-door:#5E4A3A; --m-gdoor:#5C656A; --floor:#283035; --gfloor:#30353A; --glass:#2D5260; --m-wood:#76604E; --m-pave:#4A4C46; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sheet:#12171A; --paper:#1C2327; --sky:#171D21; --ink:#E4E7E2; --soft:#8E9BA0; --rule:#39444A;
  --creek:#31A9B0; --mark:#D8785F; --ok:#86BE9C; --setback:#2A3237; --exist:#59676E;
  --new:#CBD3C9; --newink:#12171A; --fadu:#C08A5E; --fgar:#9A876C; --fstu:#6E9199;
  --tree:#4B6350; --treeink:#8FA98A; --m-l1:#9AA6AB; --m-l2:#C6CEC6; --m-grass:#27332D; --m-nb:#36413B; --m-glass:#5F727A; --m-door:#5E4A3A; --m-gdoor:#5C656A; --floor:#283035; --gfloor:#30353A; --glass:#2D5260; --m-wood:#76604E; --m-pave:#4A4C46; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sheet);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}

.tb{border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding-block:10px 11px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--cond);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--soft)}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.05;margin:0;text-wrap:balance}
.sub{font-size:12px;color:var(--soft);margin:0;max-width:78ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 30px;border-top:1px solid var(--rule);padding-top:9px;margin-top:6px}
.meta div{min-width:120px}
.meta b{display:block;font-family:var(--cond);font-weight:600;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--soft)}
.meta span{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

.work{display:flex;flex-direction:column;gap:30px}
.mapcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .lab{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-right:4px}
.chip{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;line-height:1.2}
.chip[aria-pressed="false"]{color:var(--soft);border-color:var(--rule);text-decoration:line-through;text-decoration-color:var(--rule)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,.zbtn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

.map{position:relative;height:clamp(480px,calc(100svh - 180px),1400px);border:1px solid var(--ink);background:var(--sky);overflow:hidden}
.map:has(g[data-layer="context"].off){background:var(--sheet)}
@media (max-width:980px){.map{height:min(80svh,900px)}}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;--k:.4}
#plan.drag{cursor:grabbing}
#plan:focus-visible{outline:2px solid var(--mark);outline-offset:-3px}
.ovl{position:absolute;pointer-events:none}
.north{top:10px;right:12px;width:26px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--ink)}
.north svg{width:14px;height:34px;display:block}
.scale{left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;padding:5px 7px 6px;background:var(--paper);border:1px solid var(--rule)}
.scale span{font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.scale .bar{height:5px;border:1px solid var(--ink);border-top:0;min-width:10px}
.zoom{right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
.zbtn{width:36px;height:36px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.zbtn.fit{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.zbtn:hover,.chip:hover{border-color:var(--mark)}
.hint{font-size:11px;color:var(--soft);margin:0}

/* the drawing */
#plan .nb,#plan .school{fill:var(--sky);stroke:var(--rule);stroke-width:.8px}
#plan .roof{fill:var(--setback);stroke:var(--exist);stroke-width:.7px}
#plan .lot-fill{fill:var(--paper)}
#plan .lot-line{fill:none;stroke:var(--ink);stroke-width:2.4px;stroke-linejoin:round}
:root{--fence:#9A6534}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fence:#D69A5E}}
:root[data-theme="dark"]{--fence:#D69A5E}
#plan .fence-line{fill:none;stroke:var(--fence);stroke-width:1.3px}
#plan .fence-line.nb{stroke-dasharray:2.2 1.2}
#plan .fence-post{fill:none;stroke:var(--fence);stroke-width:1.3px;stroke-linecap:round}
#plan .c-fence{fill:var(--fence)}
.sw.fence{background:transparent;border:0;border-top:3px solid var(--fence);height:8px;margin-top:7px}
.sw.nbfence{background:transparent;border:0;border-top:3px dashed var(--fence);height:8px;margin-top:7px}
#plan .creek{fill:var(--creek);fill-opacity:.2}
#plan .ease{fill:url(#hatch)}
#plan .hatch-line{stroke:var(--creek);stroke-opacity:.55;stroke-width:.35}
#plan .ease-line{fill:none;stroke:var(--creek);stroke-width:1.1px;stroke-dasharray:7 4}
#plan .strip{fill:var(--creek);fill-opacity:.07}
#plan .env{fill:none;stroke:var(--soft);stroke-width:1px;stroke-dasharray:6 4}
#plan .tob{fill:none;stroke:var(--creek);stroke-width:2.2px}
#plan .bline{fill:none;stroke:var(--ink);stroke-width:1.2px;stroke-dasharray:12 4 2 4}
#plan .zone{fill:var(--tree);fill-opacity:.12;stroke:var(--treeink);stroke-width:.8px;stroke-dasharray:3 2}
#plan .zone.key{fill-opacity:.22;stroke-dasharray:none;stroke-width:1.3px}
#plan .ring{fill:none;stroke:var(--treeink);stroke-width:1.1px;stroke-dasharray:3 3}
#plan .trunk{fill:var(--treeink)}
#plan .cant{fill:var(--new);fill-opacity:.3}
#plan .l1{fill:var(--new)}
#plan .gar{fill:var(--fgar)}
#plan .golf{fill:var(--fstu)}
#plan .adu{fill:var(--fadu)}
#plan .l2{fill:none;stroke:var(--newink);stroke-width:1.4px;stroke-dasharray:6 4}
#plan .dim{stroke:var(--mark);stroke-width:1.2px}
#plan .dot{fill:var(--mark)}
#plan path,#plan line,#plan circle{vector-effect:non-scaling-stroke}
#plan .off{display:none}
#plan text{font-family:var(--cond);font-weight:700;letter-spacing:.03em;paint-order:stroke fill;stroke:var(--paper);stroke-width:calc(var(--k) * 3.2px);stroke-linejoin:round}
#plan .t1{font-size:clamp(calc(var(--k) * 11px),3.1px,calc(var(--k) * 24px))}
#plan .t2{font-size:clamp(calc(var(--k) * 9.5px),2.5px,calc(var(--k) * 19px))}
#plan .t3{font-size:clamp(calc(var(--k) * 8.5px),2.1px,calc(var(--k) * 16px));font-weight:600}
#plan .tin{font-size:3.1px;fill:var(--newink);stroke:none;letter-spacing:.08em}
#plan .tin.sm{font-size:2.3px}
#plan .c-tree{fill:var(--treeink)}
#plan .c-mark{fill:var(--mark)}
#plan .c-creek{fill:var(--creek)}
#plan .c-soft{fill:var(--soft)}
#plan .c-ink{fill:var(--ink)}
#plan[data-zoom="far"] .minor{display:none}

/* layout switch */
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink)}
.seg button{flex:1 1 150px;background:transparent;border:0;border-left:1px solid var(--ink);padding:7px 9px;font-family:var(--mono);font-size:11.5px;color:var(--ink);cursor:pointer;line-height:1.3;text-align:left;display:flex;flex-direction:column;gap:1px}
.seg button:first-child{border-left:0}
.seg button b{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em}
.seg button small{font-size:10.5px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"] small{color:var(--rule)}
.seg button:focus-visible{outline:2px solid var(--mark);outline-offset:-3px}

#plan .zone.gone{fill:none;stroke:var(--soft);stroke-width:1px;stroke-dasharray:2 3}#plan .trunk.gone{fill:none;stroke:var(--soft);stroke-width:1px}
#plan .xmark{fill:none;stroke:var(--mark);stroke-width:2px}
.cmpwrap{overflow-x:auto}


#plan .enc{fill:url(#hatch-enc);stroke:var(--mark);stroke-width:1.2px}
#plan .hatch-enc-line{stroke:var(--mark);stroke-width:.5}


/* view modes */
.page[data-view="plan"] .mass-only{display:none!important}
.page[data-view="mass"] .plan-only{display:none!important}
.page[data-cam="walk"] .orbit-only{display:none!important}
.page:not([data-cam="walk"]) .walk-only{display:none!important}
#mass{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#mass.drag{cursor:grabbing}
#mass:focus-visible{outline:2px solid var(--mark);outline-offset:-3px}
.pad{left:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px);grid-template-areas:". f ." "l . r" ". b .";gap:3px}
.pad .zbtn{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pad .zbtn.on{background:var(--ink);color:var(--paper)}
.pad svg{width:11px;height:11px;fill:currentColor;display:block}
.touch{display:none}
@media (hover:none) and (pointer:coarse){.touch{display:inline}.mouse{display:none}}
/* layout and view pickers */
.picker{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px 14px;align-items:stretch}
.toolbar .lab{width:58px;margin-right:8px}
.pick-lab{align-self:center;font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--soft)}
.seg-view button{flex:1 1 110px}
.seg-view button b{display:flex;align-items:center;gap:7px}
.seg-view svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
@media (max-width:600px){.picker{grid-template-columns:minmax(0,1fr);gap:4px}.pick-lab{margin-top:6px}.toolbar .lab{width:auto;margin-right:4px}}
/* tips on the drawing for first-time visitors */
.howto{top:10px;left:10px;width:min(320px,calc(100% - 64px));background:var(--paper);border:1px solid var(--ink);padding:9px 34px 10px 12px;box-shadow:0 3px 14px rgb(0 0 0 / .16)}
.howto p{margin:0;font-size:11.5px;line-height:1.45;color:var(--ink)}
.howto .howh{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:10.5px;color:var(--mark);margin-bottom:4px}
.howx{position:absolute;top:3px;right:3px;width:28px;height:28px;border:0;background:transparent;color:var(--ink);font-size:19px;line-height:1;cursor:pointer;pointer-events:auto;display:grid;place-items:center;padding:0}
.howbtn{top:10px;left:10px;pointer-events:auto;font-family:var(--mono);font-size:11px;line-height:1.2;padding:5px 9px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.howx:hover,.howbtn:hover{color:var(--mark)}
.howx:focus-visible,.howbtn:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--ink)}
.mlegend span{display:flex;align-items:center;gap:5px}
.mlegend i{display:inline-block;width:12px;height:10px;border:1px solid var(--ink)}
.mlegend i.pl{background:color-mix(in srgb,var(--mark) 25%,transparent);border-color:var(--mark)}
/* schedule */
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:26px 40px;align-items:start;min-width:0}
.panel .stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel > .notes{grid-column:1/-1}
@media (min-width:880px){.panel{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
table{width:100%;border-collapse:collapse}
caption{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--soft);text-align:left;padding-bottom:6px;border-bottom:1px solid var(--ink)}
td{padding:6px 0;border-bottom:1px solid var(--rule);font-size:12px;vertical-align:top}
td.v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
td small{display:block;color:var(--soft);font-size:10.5px;line-height:1.4;margin-top:2px}
tr.total td{border-bottom:1.5px solid var(--ink);font-weight:600}
.cap2 tr.hdr td{font-family:var(--cond);font-weight:700;font-size:12px;border-bottom:1px solid var(--ink);padding:4px 0}
.cap2 td.v{width:13.5%}
.ok{color:var(--ok)}
.bad{color:var(--mark)}
.list{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px;font-size:12px}
.list li::marker{color:var(--soft)}
.h{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--soft);padding-bottom:6px;border-bottom:1px solid var(--ink);margin:0 0 8px}
.keybox{margin-top:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:11px;line-height:1.35}
.legend div{display:flex;gap:7px;align-items:flex-start}
.sw{flex:0 0 auto;width:16px;height:12px;margin-top:2px;border:1px solid var(--ink)}
.sw.l1{background:var(--new)} .sw.gar{background:var(--fgar)} .sw.golf{background:var(--fstu)} .sw.adu{background:var(--fadu)}
.sw.l2{background:var(--new);border:1.5px dashed var(--newink);outline:1px solid var(--new)}
.sw.cant{background:color-mix(in srgb,var(--new) 30%,transparent);border:1.5px dashed var(--newink);outline:1px solid var(--new)}
.sw.zone{background:color-mix(in srgb,var(--tree) 30%,transparent);border-color:var(--treeink)}
.sw.creek{background:color-mix(in srgb,var(--creek) 30%,transparent);border-color:var(--creek)}
.sw.env{background:transparent;border:1.5px dashed var(--soft)}
.sw.bl{background:transparent;border:0;border-top:2px dashed var(--ink);height:8px;margin-top:7px}
.notes{font-size:10.5px;color:var(--soft);margin:0;line-height:1.5}
/* highlights, and everything else folded under them */
.summary{display:flex;flex-direction:column;gap:12px;min-width:0}
#hl{max-width:820px;table-layout:fixed}
#hl td{font-size:11.5px;padding:6px 8px 6px 0}
#hl td:first-child{width:28%}
#hl td.v{white-space:normal;text-align:left;padding:6px 8px 6px 10px;font-family:var(--cond);font-weight:600;font-size:14px;line-height:1.25}
#hl td.v small{font-family:var(--mono);font-weight:400;font-size:10.5px}
#hl tr.hdr td{border-bottom:1px solid var(--ink);padding:0}
#hl tr.hdr button{all:unset;box-sizing:border-box;display:block;width:100%;padding:6px 10px;cursor:pointer;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--ink)}
#hl tr.hdr button:hover{text-decoration:underline;text-decoration-color:var(--mark)}
#hl tr.hdr button:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.hlnote{font-size:11.5px;color:var(--soft);margin:0;max-width:100ch}
details.more{border-top:2px solid var(--ink);margin-top:6px}
details.more > summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:11px 0 4px;font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;color:var(--ink)}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+";font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:0;width:12px;display:inline-block}
details.more[open] > summary::before{content:"\2212"}
details.more > summary small{font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px;color:var(--soft)}
details.more > summary:hover{color:var(--mark)}
details.more > summary:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.morebody{display:flex;flex-direction:column;gap:14px;padding-top:12px}
@media (max-width:600px){#hl td:first-child{width:34%} #hl td.v{font-size:12.5px;padding-left:6px;padding-right:4px} #hl tr.hdr button{padding:6px;font-size:13.5px}}
/* layout X's rooms on the drawing: Level 1, Level 2 or hidden; labels thin out as the drawing zooms out */
#plan .rm-floor{fill:var(--floor)}
#plan .rm-gar{fill:var(--gfloor)}
#plan .rm-hit{fill:transparent}
#plan .rm-wall{fill:var(--ink);fill-rule:evenodd}
#plan .rm-glass{fill:var(--glass)}
#plan .rm-ln{fill:none;stroke:var(--ink);stroke-width:.9px}
#plan .rm-ln.hi{stroke-dasharray:3 2}
#plan .rm-gd{fill:none;stroke:var(--ink);stroke-width:1px;stroke-dasharray:5 3}
#plan .rm-leaf{fill:none;stroke:var(--ink);stroke-width:1px}
#plan .rm-arc{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:.7px;stroke-dasharray:2 2}
#plan .rm-fix{fill:none;stroke:var(--soft);stroke-width:.8px}
#plan .rm-tr{fill:none;stroke:var(--soft);stroke-width:.6px}
#plan .rm-post{fill:var(--ink)}
#plan text.rm{font-size:clamp(calc(var(--k) * 8px),1.5px,calc(var(--k) * 13px));font-weight:600;letter-spacing:.06em;fill:var(--ink);text-anchor:middle}
#plan text.rm.sm{font-size:clamp(calc(var(--k) * 7px),1px,calc(var(--k) * 11px))}
#plan text.rm.d{font-size:clamp(calc(var(--k) * 7px),1.1px,calc(var(--k) * 11px));font-family:var(--mono);font-weight:400;letter-spacing:0;fill:var(--soft)}
#plan:not([data-zoom="close"]) .tiny{display:none}
#plan .terr{fill:var(--new);fill-opacity:.16}
#plan .terr-e{fill:none;stroke:var(--new);stroke-width:1.1px;stroke-dasharray:5 3}
#plan .terr-l{fill:none;stroke:var(--new);stroke-opacity:.5;stroke-width:.6px}


.page[data-rooms="1"] #plan .hx,.page[data-rooms="2"] #plan .hx,.page[data-rooms="1"] #plan .hx1,.page[data-rooms="2"] #plan .hx2{display:none}
.chip.opt[aria-pressed="false"]{text-decoration:none;color:var(--ink);border-color:var(--rule)}
.chip:disabled{opacity:.4;cursor:default}
.chip:disabled:hover{border-color:var(--rule)}







.sw.rooms{background:var(--floor);border:2px solid var(--ink)}
.sw.glass{background:var(--glass)}
.sw.terr{background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--new) 45%,transparent) 0 1px,color-mix(in srgb,var(--new) 16%,transparent) 1px 4px);border:1.5px dashed var(--new)}
/* the opening flight in 3D */
.introskip{right:10px;bottom:10px;pointer-events:auto;font-family:var(--mono);font-size:11px;line-height:1.2;padding:6px 10px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.introskip:hover{color:var(--mark)}
.introskip:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.page.intro .map .ovl:not(.introskip){visibility:hidden}
.page.intro #mass{cursor:pointer}
/* the prompt to try 3D and Walk (page v27): a row at the foot of the Plan's tips card, and a few pulses on the view buttons */
.howto .try{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule)}
.tryb{display:flex;gap:6px;margin-top:6px}
.tryb button{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;pointer-events:auto;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.04em;padding:6px 10px;line-height:1.2}
.tryb button:hover{background:var(--mark);border-color:var(--mark)}
.tryb button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.tryb svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.page.tried .howto .try{display:none}
@keyframes trypulse{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 3px var(--mark)}}
.page.nudge #v-mass,.page.nudge #v-walk{animation:trypulse 1.6s ease-in-out 4}
@media (prefers-reduced-motion:reduce){.page.nudge #v-mass,.page.nudge #v-walk{animation:none;box-shadow:inset 0 0 0 2px var(--mark)}}
@media (pointer:coarse){.tryb button{min-height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Phones (page v22): title, one row of layout and view buttons, then the drawing sized to the screen; the switches
   slide sideways under it, and the introduction and headline numbers follow the key. Bigger targets for fingers. */
@media (pointer:coarse){
  .chip{padding:8px 12px;font-size:12.5px;min-height:40px}
  .zbtn{width:44px;height:44px;font-size:19px}
  .pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .howbtn,.introskip{padding:11px 12px;font-size:12px}
  .howx{width:40px;height:40px;top:0;right:0}
  .howto{padding-right:40px}
  #hl tr.hdr button{padding-block:11px}
}
@media (max-width:600px){
  .page{padding-block:10px 32px;gap:10px}
  .tb,.work,.mapcol{display:contents}
  .eyebrow{order:1;border-top:2px solid var(--ink);padding-top:8px;margin-bottom:-7px;font-size:9.5px;letter-spacing:.13em}
  h1{order:2;font-size:22px}
  .picker{order:3;display:flex;flex-wrap:wrap;gap:8px}
  .pick-lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .seg button{min-height:44px;padding:6px 10px;justify-content:center;align-items:center}
  .seg button small{display:none}
  .seg:not(.seg-view){flex:0 0 auto;flex-wrap:nowrap}
  .seg:not(.seg-view) button{flex:0 0 auto;min-width:52px}
  .seg-view{flex:1 1 190px;flex-wrap:nowrap}
  .seg-view button{flex:1 1 auto;padding-inline:6px}
  .seg-view button b{gap:5px}
  .map{order:4;height:clamp(340px,calc(100svh - 215px),640px)}
  .toolbar{order:5;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar .lab,.toolbar .chip{flex:none;white-space:nowrap}
  .toolbar .lab{order:-2}
  #m-up{order:-1}   /* in Walk, Upstairs leads the row */
  .page[data-view="mass"] .howto{width:calc(100% - 20px)}
  .mlegend,.keybox{order:6;margin-top:4px}
  .sub{order:7;border-top:1px solid var(--ink);padding-top:12px;margin-top:12px}
  .meta{order:8;margin-top:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 16px}
  .meta div{min-width:0}
  .meta span{font-size:14px}
  .summary{order:9;margin-top:16px}
  /* the side-by-side table in the fold: each row's label across the top, X and X-18 under it, no sideways scrolling */
  
  
  
  
  
  
  
  
  
}

#plan .rm-ln{stroke-width:.6px}

.sw.conc{background:var(--setback)} .sw.perm{background:color-mix(in srgb,var(--soft) 30%,transparent)} .sw.dg{background:#C9B48E}
.sw.bed{background:color-mix(in srgb,var(--tree) 35%,transparent);border-color:var(--treeink)}
.sw.roofe{background:transparent;border:0;border-top:2px dashed var(--mark);height:8px;margin-top:7px}
.mlegend i.mt-stucco{background:#EDEBE5} .mlegend i.mt-shingle{background:#3f4144} .mlegend i.mt-frame{background:#1c1e20}

.note-list li{margin-bottom:4px}
.ovl.north{top:18px;right:30px}
.howto{width:min(230px,calc(100% - 64px))}
.howto .try{margin-top:7px;padding-top:7px}

#plan[data-zoom="far"] text.rm.sm{display:none}
